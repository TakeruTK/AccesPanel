services:
  db:
    image: postgres:16-alpine
    container_name: fix-access-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: fixaccess
      POSTGRES_USER: fixaccess
      POSTGRES_PASSWORD: fixaccess
      TZ: America/Santiago
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fixaccess -d fixaccess"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fix-access-app
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "2000:2000"
    environment:
      PORT: 2000
      TZ: America/Santiago
      SESSION_TIMEOUT_MS: 1800000
      DATABASE_URL: postgres://fixaccess:fixaccess@db:5432/fixaccess
